[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "MIT"
repository = "https://github.com/kiwamizamurai/tsumugi"
homepage = "https://github.com/kiwamizamurai/tsumugi"
keywords = ["workflow", "pipeline", "async", "state-machine", "orchestration"]
categories = ["asynchronous", "rust-patterns"]

[workspace.dependencies]
tsumugi-core = { path = "crates/tsumugi-core", version = "0.1.0" }
tokio = { version = "1", default-features = false }
async-trait = "0.1"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
